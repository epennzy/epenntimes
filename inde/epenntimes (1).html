<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epennzy Times Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            background-color: #121212;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            color: #e5e7eb;
        }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .sembunyi-scroll::-webkit-scrollbar {
            display: none;
        }
        .sembunyi-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .muncul {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tgl-kotak {
            width: 72px; 
            height: 85px; 
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            flex-shrink: 0;
            margin-top: 15px;
            background: #2a2a2a;
            border: 2px solid #333333;
        }

        .tgl-aktif {
            background: #333333;
            color: white;
            border-color: #3b82f6; 
            box-shadow: 0 8px 15px -5px rgba(59, 130, 246, 0.3);
            transform: translateY(-5px);
        }

        .titik-indikator {
            position: absolute;
            top: 10px;
            width: 6px;
            height: 6px;
            background-color: #3b82f6; 
            border-radius: 50%;
        }

        /* Struk Kotak Smooth */
        .kertas-struk {
            background: #1e1e1e;
            position: relative;
            border-radius: 32px;
            border: 1px solid #333333;
            overflow: hidden;
        }
    </style>
</head>
<body class="flex justify-center min-h-screen pb-12">

    <div class="w-full max-w-md bg-[#121212] min-h-screen relative overflow-hidden">
        
        <!-- Dashboard Utama -->
        <div id="halaman-utama" class="p-6 muncul">
            
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-2xl bg-blue-600/20 text-blue-500 flex items-center justify-center border border-blue-500/30">
                        <i data-lucide="trending-up" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-800 tracking-tight text-white leading-tight">Epennzy<span class="text-blue-500">Times</span></h1>
                        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest leading-none">Grafik & Keuangan</p>
                    </div>
                </div>
                <div class="w-10 h-10 bg-[#252525] rounded-full flex items-center justify-center text-blue-500 border border-[#333333]">
                    <i data-lucide="user" class="w-5 h-5"></i>
                </div>
            </div>

            <!-- GRAFIK -->
            <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-[28px] p-5 mb-8">
                <div class="flex justify-between items-center mb-4">
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Tren Tabungan (Hijau)</p>
                    <span id="label-total-semua" class="text-[10px] font-bold text-emerald-500"></span>
                </div>
                <div class="h-40 w-full">
                    <canvas id="grafikUtama"></canvas>
                </div>
            </div>

            <!-- Kalender -->
            <div class="mb-10">
                <div id="daftar-tanggal" class="flex overflow-x-auto gap-4 pt-2 pb-8 px-1 sembunyi-scroll snap-x"></div>
            </div>

            <!-- Input Form -->
            <div class="space-y-8">
                <!-- Kehadiran -->
                <div>
                    <h3 class="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-4 px-1">Kehadiran</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="jamKerja" value="90000" class="peer hidden" onchange="simpanData()">
                            <div class="py-4 px-1 bg-[#1a1a1a] rounded-2xl border-2 border-[#2a2a2a] peer-checked:border-blue-500 peer-checked:bg-blue-500/5 transition-all text-center">
                                <i data-lucide="sun" class="w-4 h-4 mx-auto mb-2 text-blue-500"></i>
                                <p class="text-[9px] font-bold">Siang</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="jamKerja" value="114000" class="peer hidden" onchange="simpanData()">
                            <div class="py-4 px-1 bg-[#1a1a1a] rounded-2xl border-2 border-[#2a2a2a] peer-checked:border-blue-500 peer-checked:bg-blue-500/5 transition-all text-center">
                                <i data-lucide="sunset" class="w-4 h-4 mx-auto mb-2 text-blue-500"></i>
                                <p class="text-[9px] font-bold">Sore</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="jamKerja" value="180000" class="peer hidden" onchange="simpanData()">
                            <div class="py-4 px-1 bg-[#1a1a1a] rounded-2xl border-2 border-[#2a2a2a] peer-checked:border-blue-500 peer-checked:bg-blue-500/5 transition-all text-center">
                                <i data-lucide="moon" class="w-4 h-4 mx-auto mb-2 text-blue-500"></i>
                                <p class="text-[9px] font-bold">Malam</p>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="jamKerja" value="0" class="peer hidden" onchange="simpanData()">
                            <div class="py-4 px-1 bg-[#1a1a1a] rounded-2xl border-2 border-[#2a2a2a] peer-checked:border-red-500 peer-checked:bg-red-500/5 transition-all text-center">
                                <i data-lucide="x-circle" class="w-4 h-4 mx-auto mb-2 text-red-500"></i>
                                <p class="text-[9px] font-bold">Libur</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Pengeluaran -->
                <div class="space-y-4">
                    <div class="bg-[#1a1a1a] border border-[#2a2a2a] p-4 rounded-2xl flex items-center justify-between">
                        <div><p class="font-bold text-sm">Nasi Padang</p><p class="text-[10px] text-gray-500">Rp 11.000</p></div>
                        <div class="flex bg-[#121212] p-1 rounded-xl">
                            <button onclick="pilihPorsi('padang', 0)" id="btn-padang-0" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">0</button>
                            <button onclick="pilihPorsi('padang', 1)" id="btn-padang-1" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">1</button>
                            <button onclick="pilihPorsi('padang', 2)" id="btn-padang-2" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">2</button>
                        </div>
                    </div>
                    <div class="bg-[#1a1a1a] border border-[#2a2a2a] p-4 rounded-2xl flex items-center justify-between">
                        <div><p class="font-bold text-sm">Es Kopi</p><p class="text-[10px] text-gray-500">Rp 5.000</p></div>
                        <div class="flex bg-[#121212] p-1 rounded-xl">
                            <button onclick="pilihPorsi('kopi', 0)" id="btn-kopi-0" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">0</button>
                            <button onclick="pilihPorsi('kopi', 1)" id="btn-kopi-1" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">1</button>
                            <button onclick="pilihPorsi('kopi', 2)" id="btn-kopi-2" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">2</button>
                        </div>
                    </div>
                    <div class="bg-[#1a1a1a] border border-[#2a2a2a] p-4 rounded-2xl flex items-center justify-between">
                        <div><p class="font-bold text-sm">Gorengan</p><p class="text-[10px] text-gray-500">Rp 5.000</p></div>
                        <div class="flex bg-[#121212] p-1 rounded-xl">
                            <button onclick="pilihPorsi('gorengan', 0)" id="btn-gorengan-0" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">0</button>
                            <button onclick="pilihPorsi('gorengan', 1)" id="btn-gorengan-1" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">1</button>
                            <button onclick="pilihPorsi('gorengan', 2)" id="btn-gorengan-2" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">2</button>
                            <button onclick="pilihPorsi('gorengan', 3)" id="btn-gorengan-3" class="w-9 h-9 text-xs font-bold rounded-lg transition-all">3</button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-[#1a1a1a] border border-[#2a2a2a] p-4 rounded-2xl">
                            <p class="text-[10px] font-bold text-gray-500 uppercase mb-2">Rokok</p>
                            <input type="number" id="input-rokok" placeholder="Rp 0" class="w-full bg-transparent text-sm font-bold text-white focus:outline-none" oninput="simpanData()">
                        </div>
                        <div id="wadah-kasbon" class="bg-[#1a1a1a] border border-[#2a2a2a] p-4 rounded-2xl">
                            <p class="text-[10px] font-bold text-gray-500 uppercase mb-2">Kasbon</p>
                            <input type="number" id="input-kasbon" placeholder="Rp 0" disabled class="w-full bg-transparent text-sm font-bold text-white focus:outline-none disabled:opacity-20" oninput="simpanData()">
                        </div>
                    </div>
                </div>
            </div>

            <button onclick="tampilkanRekapTotal()" class="w-full mt-10 bg-blue-600 text-white font-bold py-5 rounded-2xl shadow-xl shadow-blue-900/20 transition-all active:scale-95 flex items-center justify-center gap-3">
                <i data-lucide="file-text" class="w-5 h-5"></i>
                Recap Now
            </button>

        </div>

        <!-- Halaman Rekap (Struk Smooth) -->
        <div id="halaman-struk" class="hidden p-6 bg-[#121212] min-h-screen muncul pb-20 overflow-y-auto">
            <div class="flex items-center gap-2 mb-6 text-gray-400" onclick="tutupStruk()">
                <i data-lucide="arrow-left" class="w-5 h-5 text-blue-500"></i>
                <span class="text-sm font-bold">Kembali</span>
            </div>

            <div class="kertas-struk shadow-2xl p-8 mb-6">
                <div class="text-center border-b border-[#333] pb-6 mb-6">
                    <p class="text-blue-500 font-bold text-[10px] tracking-widest mb-1">RECAP SUMMARY</p>
                    <h2 class="text-xl font-800 text-white">EPENNZY TIMES</h2>
                    <p class="text-[9px] text-gray-500 mt-2">AKUMULASI SELURUH DATA TERISI</p>
                </div>

                <div class="space-y-4 mb-8" id="struk-list-total">
                    <!-- List Rekap via JS -->
                </div>

                <div class="pt-6 border-t border-[#333] mb-8">
                    <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Total Sisa Tabungan</p>
                    <p id="struk-total-akhir" class="text-3xl font-800 text-emerald-500"></p>
                </div>

                <div class="bg-[#252525] p-5 rounded-2xl border border-blue-500/20">
                    <p id="teks-motivasi" class="text-xs italic text-gray-300 leading-relaxed text-center"></p>
                </div>
            </div>
            
            <button onclick="tutupStruk()" class="w-full bg-[#252525] text-gray-400 py-4 rounded-2xl text-sm font-bold border border-[#333]">
                Tutup Rekap
            </button>
        </div>

    </div>

    <script>
        lucide.createIcons();
        const daftarTanggal = [];
        let tglMulai = new Date('2026-02-20'), tglSelesai = new Date('2026-03-13'), tglLoop = new Date(tglMulai);
        while (tglLoop <= tglSelesai) {
            daftarTanggal.push(tglLoop.toISOString().split('T')[0]);
            tglLoop.setDate(tglLoop.getDate() + 1);
        }

        let semuaData = JSON.parse(localStorage.getItem('epennzy_v11')) || {};
        let tanggalDipilih = daftarTanggal[0], myChart = null;

        const quotes = [
            "Lelah hari ini adalah investasi masa depanmu. Tetap semangat!",
            "Jangan lihat seberapa banyak uangmu, lihatlah seberapa disiplin kamu mengaturnya.",
            "Sukses adalah kumpulan dari usaha kecil yang dilakukan hari demi hari.",
            "Tabunganmu hari ini adalah nafasmu di masa sulit nanti.",
            "Kerja kerasmu tidak akan sia-sia, setiap rupiah ada ceritanya."
        ];

        function formatUang(n) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n); }

        function buatKotakTanggal() {
            const wadah = document.getElementById('daftar-tanggal');
            wadah.innerHTML = '';
            daftarTanggal.forEach(tgl => {
                const d = new Date(tgl), aktif = tgl === tanggalDipilih, data = semuaData[tgl];
                const adaData = data && (data.upah !== undefined);
                const box = document.createElement('div');
                box.className = `tgl-kotak cursor-pointer snap-center ${aktif ? 'tgl-aktif' : 'text-gray-500'}`;
                box.onclick = () => { simpanData(); tanggalDipilih = tgl; buatKotakTanggal(); muatDataKeLayar(); renderGrafik(); };
                box.innerHTML = `${adaData ? '<div class="titik-indikator"></div>' : ''}<span class="text-[10px] font-bold uppercase mb-1 opacity-50">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]}</span><span class="text-lg font-800">${d.getDate()}</span>`;
                wadah.appendChild(box);
                if(aktif) box.scrollIntoView({ behavior: 'smooth', inline: 'center' });
            });
        }

        function simpanData() {
            if(!semuaData[tanggalDipilih]) semuaData[tanggalDipilih] = {};
            const r = document.querySelector('input[name="jamKerja"]:checked');
            if(r) semuaData[tanggalDipilih].upah = parseInt(r.value);
            semuaData[tanggalDipilih].rokok = document.getElementById('input-rokok').value;
            semuaData[tanggalDipilih].kasbon = document.getElementById('input-kasbon').value;
            localStorage.setItem('epennzy_v11', JSON.stringify(semuaData));
        }

        function muatDataKeLayar() {
            const isJumat = new Date(tanggalDipilih).getDay() === 5;
            document.getElementById('input-kasbon').disabled = !isJumat;
            document.getElementById('wadah-kasbon').style.opacity = isJumat ? '1' : '0.4';
            const d = semuaData[tanggalDipilih] || {};
            document.querySelectorAll('input[name="jamKerja"]').forEach(radio => radio.checked = radio.value == d.upah);
            pilihPorsi('padang', d.padang || 0); pilihPorsi('kopi', d.kopi || 0); pilihPorsi('gorengan', d.gorengan || 0);
            document.getElementById('input-rokok').value = d.rokok || '';
            document.getElementById('input-kasbon').value = d.kasbon || '';
        }

        function pilihPorsi(jenis, n) {
            if(!semuaData[tanggalDipilih]) semuaData[tanggalDipilih] = {};
            semuaData[tanggalDipilih][jenis] = n;
            const limit = jenis === 'gorengan' ? 3 : 2;
            for(let i=0; i<=limit; i++) {
                const btn = document.getElementById(`btn-${jenis}-${i}`);
                btn.className = (i === n) ? "w-9 h-9 text-xs font-800 rounded-lg bg-blue-600 text-white shadow-lg" : "w-9 h-9 text-xs font-bold rounded-lg text-gray-500";
            }
            simpanData(); renderGrafik();
        }

        function hitungDataHarian(d) {
            const upah = d.upah || 0, keluar = ((d.padang||0)*11000)+((d.kopi||0)*5000)+((d.gorengan||0)*5000)+(parseInt(d.rokok)||0)+(parseInt(d.kasbon)||0);
            return { upah, keluar, bersih: upah - keluar };
        }

        function renderGrafik() {
            const ctx = document.getElementById('grafikUtama').getContext('2d'), labels = [], dataBersih = [];
            let total = 0;
            daftarTanggal.forEach(tgl => {
                const d = semuaData[tgl];
                if(d && d.upah !== undefined) {
                    const res = hitungDataHarian(d);
                    labels.push(new Date(tgl).getDate()); dataBersih.push(res.bersih); total += res.bersih;
                }
            });
            document.getElementById('label-total-semua').innerText = formatUang(total);
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [{ data: dataBersih, borderColor: '#10b981', borderWidth: 3, tension: 0.3, pointRadius: 4, pointBackgroundColor: '#10b981', fill: true, backgroundColor: 'rgba(16, 185, 129, 0.05)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#666', font: { size: 9, weight: 'bold' } } }, y: { grid: { color: '#222' }, ticks: { display: false } } } }
            });
        }

        function tampilkanRekapTotal() {
            simpanData();
            let totalUpah = 0, totalPdg = 0, totalKpi = 0, totalGrg = 0, totalRkk = 0, totalKsb = 0, hariKerja = 0;
            
            Object.values(semuaData).forEach(d => {
                if(d.upah !== undefined) {
                    hariKerja++;
                    totalUpah += d.upah;
                    totalPdg += (d.padang || 0);
                    totalKpi += (d.kopi || 0);
                    totalGrg += (d.gorengan || 0);
                    totalRkk += (parseInt(d.rokok) || 0);
                    totalKsb += (parseInt(d.kasbon) || 0);
                }
            });

            if(hariKerja === 0) return;

            document.getElementById('halaman-utama').classList.add('hidden');
            document.getElementById('halaman-struk').classList.remove('hidden');

            const wadah = document.getElementById('struk-list-total');
            wadah.innerHTML = `
                <div class="flex justify-between items-center text-sm mb-4">
                    <span class="text-gray-400">Total Pendapatan (${hariKerja} hari)</span>
                    <span class="text-white font-bold">${formatUang(totalUpah)}</span>
                </div>
                <div class="h-px bg-[#333] w-full my-4"></div>
                <div class="space-y-3">
                    <div class="flex justify-between text-xs"><span>Nasi Padang (${totalPdg}x)</span><span class="text-red-400">-${formatUang(totalPdg*11000)}</span></div>
                    <div class="flex justify-between text-xs"><span>Es Kopi (${totalKpi}x)</span><span class="text-red-400">-${formatUang(totalKpi*5000)}</span></div>
                    <div class="flex justify-between text-xs"><span>Gorengan (${totalGrg} porsi)</span><span class="text-red-400">-${formatUang(totalGrg*5000)}</span></div>
                    <div class="flex justify-between text-xs"><span>Total Rokok</span><span class="text-red-400">-${formatUang(totalRkk)}</span></div>
                    <div class="flex justify-between text-xs"><span>Total Kasbon</span><span class="text-red-400">-${formatUang(totalKsb)}</span></div>
                </div>
            `;

            const totalBersih = totalUpah - ((totalPdg*11000)+(totalKpi*5000)+(totalGrg*5000)+totalRkk+totalKsb);
            document.getElementById('struk-total-akhir').innerText = formatUang(totalBersih);
            document.getElementById('teks-motivasi').innerText = `"${quotes[Math.floor(Math.random() * quotes.length)]}"`;
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        function tutupStruk() {
            document.getElementById('halaman-struk').classList.add('hidden');
            document.getElementById('halaman-utama').classList.remove('hidden');
            buatKotakTanggal();
        }

        window.onload = () => { buatKotakTanggal(); muatDataKeLayar(); renderGrafik(); };
    </script>
</body>
</html>
